name: Build
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            goarch: amd64
            wails_platform: darwin/amd64   # ✅ Wails-compatible platform name
          - os: macos-latest
            goarch: arm64
            wails_platform: darwin/arm64
          - os: ubuntu-latest
            goarch: amd64
            wails_platform: linux/amd64
          - os: windows-latest
            goarch: amd64
            wails_platform: windows/amd64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Add Go bin to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Build with Wails
        run: wails build -platform ${{ matrix.wails_platform }}  # ✅ Use the mapped name

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neuron-search-${{ matrix.os }}-${{ matrix.goarch }}
          path: |
            build/bin/*
            !build/bin/*.dSYM
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')  # only runs on tag pushes
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}